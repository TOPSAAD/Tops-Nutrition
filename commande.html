<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commander</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><section><div class="wrap"><h1 style="font-size:3rem">Votre commande</h1><div class="cod">Paiement à la livraison — aucun paiement en ligne nécessaire.</div><div class="two"><form id="orderForm" class="box"><label>Nom complet<input name="nom" required autocomplete="name"></label><label>Téléphone<input name="telephone" type="tel" required autocomplete="tel" placeholder="06 00 00 00 00"></label><label>Ville<input name="ville" required></label><label>Quartier<input name="quartier" required></label><label>Adresse complète<textarea name="adresse" rows="2" required></textarea></label><label>Produit<select name="produit" id="psel"></select></label><label>Quantité<input name="quantite" id="qty" type="number" min="1" max="10" value="1"></label><label>Commentaire (facultatif)<textarea name="commentaire" rows="2"></textarea></label><button class="btn" style="width:100%;margin-top:16px">Confirmer ma commande</button></form><div class="box recap" style="align-self:start"><h3>Récapitulatif</h3><div id="recap"></div></div></div></div></section><script src="js/script.js"></script></body></html>
